<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" />
    <meta name="description" content="Daymark — build a life that feels intentional, one day at a time." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <title>Daymark — Make today count</title>
  </head>
  <body>
    <div id="root">
      <div id="daymark-boot-fallback" role="status" aria-live="polite">
        <div class="boot-mark"><span></span><span></span><span></span><span></span></div>
        <strong>Opening Daymark…</strong>
        <span>Preparing your workspace.</span>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("root");
        function showStartupError(message) {
          var fallback = document.getElementById("daymark-boot-fallback");
          if (!fallback || !root || root.querySelector(".app-shell, .auth-screen, .app-fatal-screen")) return;
          fallback.innerHTML = '<div class="boot-mark"><span></span><span></span><span></span><span></span></div><strong>Daymark couldn’t start</strong><span>' +
            String(message || "The app did not finish loading.").replace(/[<>&"]/g, "") +
            '</span><button onclick="window.location.reload()">Reload app</button>';
          fallback.classList.add("boot-failed");
        }
        window.addEventListener("error", function (event) {
          if (event.message) showStartupError(event.message);
          else if (event.target && event.target.tagName === "SCRIPT") showStartupError("The app script could not be loaded.");
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason && event.reason.message ? event.reason.message : "An unexpected startup error occurred.";
          showStartupError(reason);
        });
        window.setTimeout(function () {
          if (root && document.getElementById("daymark-boot-fallback")) {
            showStartupError("Loading took longer than expected. Please reload and try again.");
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
